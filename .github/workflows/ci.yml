name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Same release as the local toolchain: g++-16 is in Ubuntu resolute, not in older LTS images.
    container: ubuntu:resolute
    steps:
      - name: Prepare the image
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sed -i '/^Components: / { /universe/! s/$/ universe/ }' /etc/apt/sources.list.d/ubuntu.sources
          fi
          apt-get update

      - uses: actions/checkout@v4

      - name: Install toolchain and analyzers
        run: |
          apt-get install -y --no-install-recommends \
            g++-16 \
            cmake \
            ninja-build \
            pkg-config \
            clang-format \
            gcovr \
            libgtest-dev \
            python3

      - name: Configure
        run: cmake --preset gcc16

      - name: Build
        run: cmake --build --preset gcc16

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Configure sanitizers
        run: cmake --preset gcc16-sanitizers

      - name: Build sanitizers
        run: cmake --build --preset gcc16-sanitizers

      - name: Test sanitizers
        run: ctest --test-dir build-sanitizers --output-on-failure --no-tests=error

      - name: Configure coverage
        run: cmake --preset gcc16-coverage

      - name: Build coverage
        run: cmake --build --preset gcc16-coverage

      - name: Coverage
        run: cmake --build build-coverage --target coverage

      # GITHUB_TOKEN pushes do not start another run of this workflow.
      - name: Publish coverage badge
        if: github.event_name == 'push'
        run: |
          git add badges/coverage.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update the coverage badge."
          git push origin "HEAD:${GITHUB_REF}"

      # clang-tidy and cppcheck stay available as CMake targets, but this job
      # does not run them: they cannot read the module artifacts GCC produces.
      - name: clang-format
        run: cmake --build build --target format-check

