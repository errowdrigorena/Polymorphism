name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Same release as the local toolchain: g++-16 is in Ubuntu resolute, not in older LTS images.
    container: ubuntu:resolute
    steps:
      - name: Prepare the image
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sed -i '/^Components: / { /universe/! s/$/ universe/ }' /etc/apt/sources.list.d/ubuntu.sources
          fi
          apt-get update

      - uses: actions/checkout@v4

      - name: Install toolchain and analyzers
        run: |
          apt-get install -y --no-install-recommends \
            g++-16 \
            cmake \
            make \
            pkg-config \
            clang-format \
            clang-tidy \
            cppcheck \
            libgtest-dev

      - name: Configure
        run: cmake --preset gcc16

      - name: Build
        run: cmake --build --preset gcc16

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: clang-format
        run: cmake --build build --target format-check

      - name: clang-tidy
        run: cmake --build build --target tidy

      - name: cppcheck
        run: cmake --build build --target cppcheck
